events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8080;
        location /metrics {
            stub_status on;
            allow all;
        }
    }

    server {
        listen 80;

        location / {
            set $backend "http://ethereum-node:8545";
            proxy_pass $backend;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback;
        }

        location @fallback {
            set $backup_node "https://cloudflare-eth.com";
            proxy_pass $backup_node;
            proxy_ssl_server_name on;
            proxy_ssl_name cloudflare-eth.com;
            
            proxy_set_header Host cloudflare-eth.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept application/json;
        }
    }
}
