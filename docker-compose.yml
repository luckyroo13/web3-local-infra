services:
  ethereum-node:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: local-evm-blockchain
    # AGREGADO: --metrics para que Anvil genere datos médicos.
    entrypoint: anvil --host 0.0.0.0 --allow-origin "*"
    ports:
      - "8545:8545"
    restart: always

  block-explorer:
    image: otterscan/otterscan:latest
    container_name: web-block-explorer
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - ethereum-node

  # EL RECOLECTOR DE DATOS
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    depends_on:
      - ethereum-node

  # EL PANEL DE CONTROL VISUAL
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Tu contraseña temporal
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus
  
  # ASEGÚRATE DE QUE SE VEA EXACTAMENTE ASÍ DE ALINEADO:
  rpc-gateway:
    image: nginx:latest
    container_name: smart-rpc-proxy
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ethereum-node
    restart: always
