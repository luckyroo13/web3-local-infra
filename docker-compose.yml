services:
  ethereum-node:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: local-evm-blockchain
    command: "anvil --host 0.0.0.0"
    ports:
      - "8545:8545"
    restart: always

  explorer:
    image: otterscan/otterscan:latest
    container_name: local-block-explorer
    ports:
      - "8080:80"
    depends_on:
      - ethereum-node
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always

  rpc-gateway:
    image: nginx:latest
    container_name: smart-rpc-proxy
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-metrics-exporter
    command:
      - "-nginx.scrape-uri=http://rpc-gateway:8080/metrics"
    ports:
      - "9113:9113"
    depends_on:
      - rpc-gateway
    restart: always
